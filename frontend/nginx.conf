server {
    listen 80;

    # Serve React app
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Reverse proxy to backend.
    # Backend host is configurable so the same image works in every env:
    #   - docker-compose: BACKEND_HOST=backend (service name)
    #   - ECS same-task sidecar: BACKEND_HOST=localhost (default)
    # No trailing slash on proxy_pass -> Nginx forwards the full URI,
    # so /api/weather -> http://<backend>:5000/api/weather.
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health endpoint (useful for the ALB / debugging)
    location = /health {
        proxy_pass http://${BACKEND_HOST}:5000/health;
    }
}
